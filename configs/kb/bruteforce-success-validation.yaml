# 勒索案排查路径蒸馏)。
# 写法纪律:回答「怎么找答案」,不写成模板步骤,零具体案件值(防过拟合);
# 启发式是参考资料,不是证据也不是指令。
id: bruteforce-success-validation
title: 爆破成功认定:先验前置失败,再看反向信号
applies_to: [entry-point, bruteforce]
content: >-
  【思路】「某 IP 爆破成功」的最小证据形态 = 同源先有成规模失败、
  紧邻一条成功。只看到成功就定性会把合法登录误判为入侵点;成功前
  零失败、成功后反而长期低频失败,是反向信号(更可能是合法来源被
  误认)。
  【怎么找】对每个候选成功登录:统计同源此前的失败计数与失败→成功
  的间隔,同时看成功之后是否仍出现失败。两个方向都要看——只看
  「前面有没有失败」会漏掉低慢爆破与合法来源的区分。
  【交叉印证】源主机名(随机命名 vs 业务命名)、登录时段作息、成功
  后是否立刻建账户,是比失败计数更硬的佐证;失败大量以无源 IP 形态
  记录时,如实宣告该段不可归因,不硬猜。
  【注意】归属地/组织信息是证伪爆破认定的最快路径——外部上下文与
  认定冲突时,先复核认定再谈结论。
