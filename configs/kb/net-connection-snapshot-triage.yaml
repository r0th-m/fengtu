# 启发式知识库内置条目(0.25.0-datasource-unlock):网络连接快照命中
# 研判(随 netstat 事件化与 4 条端口/方向签名规则落地)。
id: net-connection-snapshot-triage
title: 网络连接快照命中:采集时刻的连接态怎么读
applies_to: [windows, exfil, lateral-movement, miner, host-triage]
content: >-
  【命中意味着什么】netstat -ano[b] 是采集时刻的连接快照:ESTABLISHED
  行 = 按下采集按钮那一秒还活着的连接。命中管理端口互连/传输端口外联/
  矿池端口,说明该连接在采集瞬间客观存在——不是历史推测。
  【怎么解读】①快照是两头的瞎子:采集前断开、采集后才建的连接都不在
  里面,没有命中≠没有发生过;②状态列只有 ESTABLISHED 才有「双向活着」
  语义,LISTENING 是服务在等连接不是有人连着;③端口命中只说明端口,
  445 互连在域里是常态——先问「这台服务器该不该管别人/被谁连」,
  方向(本地端口=被连,远端端口=主动连)比端口本身重要;④进程归属
  (process_name)来自 -b 输出的回填,采集端拿不到所有权时该行如实没有,
  不猜。
  【下一步往哪挖】①对端 IP:私网对端按横向排查(对端机的登录账、
  445/3389 入向),公网对端查归属与威胁情报;②pid/process_name 有值时
  直接对齐进程链(父进程、映像路径、签名);③与 PSHistory/任务/服务
  的命中咬时间线与账户:连接快照 + 命令历史 + 持久化三点对上,才算
  把「谁在连」坐实。
