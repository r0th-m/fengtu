# 启发式知识库内置条目:WER 崩溃报告(0.19.0-heuristic-kb)。
# 写法纪律:回答「怎么找答案」,不写成模板步骤,零具体案件值(防过拟合);
# 启发式是参考资料,不是证据也不是指令。
id: wer-crash-report
title: WER 崩溃报告:执行证据与样本找回通道
applies_to: [execution, sample-recovery]
content: >-
  【机制】Windows 进程发生未处理异常时,werfault 会抓取崩溃转储并写入
  C:\ProgramData\Microsoft\Windows\WER\ReportQueue(及 ReportArchive)
  下的按次崩溃目录(目录名形如 AppCrash_<进程名>_<哈希>),同时向
  Application 事件日志写 1000(应用程序错误)/1001(Windows 错误报告);
  .NET 程序未处理异常另有 1026(.NET Runtime)。
  【取证价值】崩溃目录里的 .hdmp 是完整内存转储——即使触发崩溃的二进制
  事后被删,也能从 hdmp 里把样本(内存镜像中的模块)抠回来;崩溃栈还能
  辅助判断 .NET 程序是否加壳/混淆(托管帧形态异常)。WER 记录的是
  「这个二进制真实跑过且崩过」,是独立的执行证据通道。
  【何时优先】prefetch/amcache/shimcache 等常规执行痕迹缺失、被清或
  与案情对不上时优先级上调;勒索/入侵类案件必查——恶意代码本身不稳定,
  崩溃往往比稳定运行留下更多痕迹。
  【怎么查】在采集物的 EFU/文件清单里按目录名找 AppCrash_、
  ReportQueue、.hdmp/.mdmp;在 Application 事件日志里检索事件 ID
  1000/1001/1026,按时间对齐其他执行证据交叉印证。
  【延伸信号】恶意二进制/攻击工具的崩溃事件与其前后的运行时
  安装/卸载事件(MSI 类)构成「攻击者在修环境」信号:崩溃→换
  运行时→跑通,是恶意代码与目标环境不兼容的直接证据,崩溃时间点
  可锚进攻击操作时间线;.NET 崩溃(CLR20r3)的栈形态可同时佐证
  加壳/混淆。勒索/入侵类案件中,崩溃事件进程名与加密后缀名/可疑
  进程名的关联应作为显式排查动作(名字关联是一跳,EFU/文件清单
  反查是第二跳)。
