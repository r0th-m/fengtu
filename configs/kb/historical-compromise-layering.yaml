id: historical-compromise-layering
title: 长期暴露主机:恶意痕迹按落地时间分代,先分层再定性
applies_to: [entry-point, timeline, attribution]
content: >-
  【思路】长期暴露主机的恶意痕迹往往是多个年份、多个团伙的叠加层。
  先按落地时间分代,再判断本次事件用的是哪层遗产——不分层就把
  早年痕迹算进本次入侵链,是最常见的过归因。
  【怎么找】给每个可疑痕迹(后门账户、持久化项、可疑二进制)标落地
  时间:间隔以年计的分属不同代;本次窗口内的操作若依赖早年落地的
  持久化,是「旧通道的新利用」,入侵时间按新利用算。口令空窗期统计
  (全量改密事件分布)回答「权限靠什么维持」。
  【交叉印证】分代结论要与本次事件的登录面、执行链各自独立咬合;
  同代痕迹之间应能互相解释(同一投放批次的文件时间聚集等)。
  【注意】多代沦陷的机器结论应导向重装而非清理;「爆破成功时间」
  只能下推到日志覆盖起点,更早的如实标「日志不可考」。
