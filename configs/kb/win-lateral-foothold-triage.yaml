# 启发式知识库内置条目:Windows 横向移动研判(0.22.0-treecourt-port)。
id: win-lateral-foothold-triage
title: Windows 横向移动:登录账 → 落点 → 工具痕迹的链式互证
applies_to: [lateral-movement, windows, host-triage]
content: >-
  【思路】横向移动的行为链是「远程登录 → 远程落脚 → 继续外跳」。
  单看任何一个事件都可能是合法运维:7045 新服务=软件部署、4698
  建任务=运维脚本、管理端口连接=域控/文件共享。定性的钥匙在链式
  互证与身份对账:这条登录该不该发生、这个落点是谁创建的。
  【怎么找】登录账:4624/4625 挑类型 3(网络)与类型 10(RDP),
  盯内网来源(谁在连我)、账户与机器身份不符、密集失败后接成功
  (爆破得手)。落点:7045/4698 看创建者账户是不是刚远程登录进来
  的那个、映像路径是否落可写目录或远程共享路径(\\host\share
  直接高危)、创建时间与登录时间咬不咬合。工具:psexec 系执行
  痕迹(Prefetch),psexesvc 出现在本机=本机被 psexec 远程执行过。
  【交叉印证】用反证防过拟合:若「攻击者已持有有效凭据」成立,
  则不应观察到针对该账户的持续密集 4625 失败——密集失败反而证伪
  「凭据已到手」。给出横向假设时主动去找这类反证观察点。
  【注意】5140/5145 共享访问若只有通道计数没有明细,如实说「有
  计数无明细,建议补采」,不许编记录。管理员工具与攻击工具同形,
  分不清时把「该主机的角色该不该发起这类连接」作为第一问。
