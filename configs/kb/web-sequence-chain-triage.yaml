# 启发式知识库内置条目(0.21.0-operator-port):通用链式序列算子命中
# 研判(web-sequence-chain,对齐索图 sequence;配置样例=认证失败后
# 成功链 401/403×N → 窗口内 200)。
id: web-sequence-chain-triage
title: 链式序列(失败后成功链)命中:怎么解读、往哪挖
applies_to: [web, sequence]
content: >-
  【命中意味着什么】同复合键(如 src_ip+path)内首步(如 401/403)
  出现达最低次数后,窗口内依次出现后续步(如 200)——链式结构本身
  是客观的:失败串与成功都在,间隔在窗内。但链式命中≠成功入侵:
  正常用户多次输错密码后登录成功完全符合同一条链,这是本算子最大
  的合法形态。锚点行=末步命中行,chain_line_nos 直给整条链各行号。
  【怎么解读】先确认末步的「成功语义」——哪些状态码/值算「成了」
  是应用属性(params 可配,默认 401/403→200 只是通用起点);再读
  首步计数与窗口:几十上百次失败后的成功,和三五次失败后的成功,
  分量完全不同。
  【下一步往哪挖】①把链上各行按时间排开看节奏:匀速高密度失败
  =工具爆破,不规则稀疏=人试错;②成功后该 src_ip 的行为是定性
  关键——上来就访问后台/传文件/改配置的是成了,继续常规浏览的
  像用户;③查该账户这段时间的登录基线(常用 IP/UA/时段),偏离
  即升级;④爆破疑似的,回查同 src_ip 是否还打了别的账户/路径
  (喷洒面),并联动主机侧登录事件互证;⑤确认是用户自己后,把该
  账户/IP 形态记入排除清单,别让它下次再占待审位。
