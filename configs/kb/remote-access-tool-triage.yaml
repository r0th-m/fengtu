# 启发式知识库内置条目:消费级远控痕迹研判(0.22.0-treecourt-port)。
id: remote-access-tool-triage
title: 远控痕迹:先问「谁装的、谁在连」,不先定性
applies_to: [remote-access, windows, host-triage]
content: >-
  【思路】AnyDesk/向日葵/RustDesk/ToDesk 这类消费级远控在应急里
  是「审计逃逸型通道」:不产生常规登录事件、流量走厂商中继。
  但合法远控与滥用远控同形——检出痕迹的第一问不是「是不是木马」,
  而是「谁装的、谁在连、该不该在」。企业统一部署的远控是合法的,
  结合环境说理由。
  【怎么找】安装/运行痕迹:安装目录、服务、进程、执行痕迹
  (Prefetch/UserAssist)。有正在用的,找会话日志(incoming/
  outgoing、对端 ID、时间):incoming 会话=谁连进来的、会话时间
  与登录/落点事件咬合的、对端 ID 反复出现的,都是重点。
  【交叉印证】远控会话时间 × 落点事件(7045/4698)× 文件落地
  时间窗,三者咬合才能讲「通过远控进来做了什么」;只有安装
  痕迹没有会话证据,按「存在通道能力」报,不写「已被滥用」。
  【注意】查不到安装痕迹就如实说没有,别硬安一个;会话日志
  目录路径列出来建议人工提取,机器不替人读未采集的内容。
