# 启发式知识库内置条目:Linux webshell 链研判(0.22.0-treecourt-port,
# 实案复盘通用化,零案件特化值)。
id: linux-webshell-chain-triage
title: Linux webshell 三级链:入口 → 驻留 → 波次操作;缺口本身是证据
applies_to: [linux, webshell, web-attack, host-triage]
content: >-
  【思路】Linux webshell 的通用结构是三级链:Web 入口(SQLi/
  未授权管理接口)→ webshell 驻留 Web 服务进程 → 每波操作往
  可写目录丢改名 shell/工具 → C2 作第二立足点。三条核心心法:
  ①日志缺口本身是证据——断档区间恰好盖住落地窗口,就是攻击者
  可能擦过日志的证据,不是「没数据」;②文件名会撒谎,命令行
  参数才是真身——工具改名成正经软件名是常见手法;③webshell
  是消耗品,C2 才是常驻资产。
  【怎么找】先量日志窗口完整性(首尾时间/中间断档),再定 Web
  入口(同一个利用动作,200 成功与 500 失败分开报——失败是
  尝试,成功才是失陷);顺 Web 服务进程(java/nginx/php-fpm)
  的派生链找 /tmp、/dev/shm 随机名可执行文件(投放改名 bash
  规避审计是头号嫌疑);清点可写目录落地物:同尺寸同哈希家族
  (归并后 mtime 聚簇=操作波次)、隐藏文件、已删除仍打开的。
  【交叉印证】同秒双源互证(Web 双侧日志同秒、agent 告警时间
  戳对文件 mtime);快照差分(两次采集 diff,新增物=落地事件);
  C2 外联看心跳(固定间隔±抖动的周期短连接)——外联审计比
  strings 更可靠,实战 C2 二进制里未必有硬编码地址。
  【注意】bash_history 只在交互式登录时有用——webshell 非交互
  执行不写 history,查不到不等于没跑过;二进制永不执行,哈希+
  strings 静态识别;定性分两档:干净工具被恶意使用(bash 本体)
  与恶意本体(C2/扫描器),别混为一谈。
