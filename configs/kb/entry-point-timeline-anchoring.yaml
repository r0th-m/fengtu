# 启发式知识库内置条目:侵入点还原(0.19.0-heuristic-kb)。
# 写法纪律:回答「怎么找答案」,零具体案件值(防过拟合)。
id: entry-point-timeline-anchoring
title: 侵入点还原:以最早异常为锚,向前推初始访问通道
applies_to: [entry-point, timeline]
content: >-
  【思路】侵入点不是「找到恶意文件」就结束——要回答「它怎么进来的」。
  方法是从已确认的最早异常(首个恶意二进制落地、首条异常登录、首个
  可疑进程)往回推:同一账户/同一源 IP/同一进程树在更早时间里做过
  什么。
  【怎么找】把已确认异常的时间点当锚:在登录面(认证成功/失败、
  会话建立)里找锚点前的最后一段异常序列——暴破成功的特征是先密
  后稀的失败再接成功;在服务暴露面(Web/远程管理/远程接入)的
  访问日志里找锚点前的异常请求(非常见路径、异常 UA、探测后接
  写入);在邮件/下载/文档类痕迹里找锚点前最近的落地链。
  【交叉印证】侵入通道的结论至少需要两类独立证据咬合(如:认证
  日志的异常登录 + 该会话内落地的二进制);只有单类证据时措辞
  保持「疑似通道」,并列出还需要什么数据才能坐实。
  【注意】数据未覆盖的通道如实宣告「无法排除」,不许用已覆盖
  通道的阴性结果反推未覆盖通道清白。
