# 启发式知识库内置条目(0.21.0-operator-port):同键分化算子命中研判
# (web-key-divergence 均值比模式,对齐索图 same_key_divergence——
# 同路径+同 IP+同 UA 跨方法返回长度分化的 0day 狩猎实案沉淀)。
id: web-key-divergence-triage
title: 同键跨方法分化命中:怎么解读、往哪挖
applies_to: [web, divergence]
content: >-
  【命中意味着什么】同一复合键(默认 path+src_ip+ua)内按方法分桶,
  响应 bytes 均值 max/min 超阈——同一个客户端对同一个路径,不同
  方法的返回体量显著不同。实案语境里这是 0day/漏洞利用的指纹:
  正常 GET 走模板,利用流量(POST/PUT/其他动词)触发的是另一条
  代码路径,返回体天然异于常态。min 桶均值为 0 而 max>0 会记无限
  分化如实命中(某方法返回空体)。分化≠异常:GET 取页面/POST 提
  表单的业务天然如此,命中只进待审区。
  【怎么解读】detail 的 buckets 直给各方法的 count/avg——先读
  哪个方法是少数派、均值差多少;少数派方法是 PUT/DELETE/PATCH/
  自定义动词时权重上调,是 GET/POST 时先看业务形态。
  【下一步往哪挖】①把少数派方法的请求体/响应体调出来看内容,
  均值比只是引子;②确认该接口该不该支持这个方法(不支持却 200
  = 高疑,不支持却 405 反而是正常拦截);③按时间序排该键的全部
  事件,看少数派方法是持续使用(业务)还是窗口内集中出现(利用
  尝试);④配合尺寸离群看同 path 是否有响应尺寸少数派,两弱信号
  咬合可升级;⑤疑似利用的,转入侵链:马名访问、命令执行参数、
  主机侧新写文件时间簇。
