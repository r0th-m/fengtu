# 启发式知识库内置条目:勒索案件加密时间窗定位(0.19.0-heuristic-kb)。
# 写法纪律:回答「怎么找答案」,零具体案件值(防过拟合)。
id: ransomware-encryption-window
title: 勒索案件加密时间窗定位:按后缀聚合计数 + 最早修改时间
applies_to: [timeline, execution]
content: >-
  【思路】加密时间窗是勒索案时间线的锚:窗口上界≈加密启动,下界≈加密
  收尾,窗口前推才是入侵与横向阶段。不猜具体后缀名——用统计找。
  【怎么找】在采集物的文件清单/EFU 导出里,按扩展名聚合计数:正常机器
  的扩展名分布是长尾的,勒索加密后缀会表现为「同一罕见后缀在短时间
  内爆出大量文件」。锁定后缀后,按文件修改时间排序取最早/最晚,即
  加密窗口;再把窗口起点与登录面、执行痕迹(进程、计划任务、服务
  安装)对齐,定位加密进程与启动账户。
  【交叉印证】窗口内若文件修改时间呈现目录序/盘符序推进,可判断加密
  遍历顺序;窗口与卷影删除、日志清除等反取证动作的时间先后关系,
  比单一时间点更能说明操作顺序。
  【注意】修改时间可被改写,结论措辞保持「疑似窗口」;有 $LogFile/
  USN 类文件系统日志时以它复核,锚点仍锚采集物行号。
