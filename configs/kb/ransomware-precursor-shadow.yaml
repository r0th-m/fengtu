# 启发式知识库内置条目:勒索前置行为研判(0.22.0-treecourt-port)。
id: ransomware-precursor-shadow
title: 勒索前置:删影断后路是最强前置信号,与加密时间簇咬合才定性
applies_to: [ransomware, windows, anti-forensics]
content: >-
  【思路】勒索软件动手前的通用前置是「先断恢复后路」:删卷影、
  删备份目录、关启动恢复。vssadmin/wbadmin/bcdedit 这些工具本身
  合法(备份维护也用),所以删影命令命中≠勒索——它与批量加密的
  时间簇咬合才是定性链。清日志(1102)同理:正常运维极少触发,
  命中即查清除者与前后窗口。
  【怎么找】三个视角互为备份:4688 进程创建的命令行(delete
  shadows/shadowcopy delete/delete catalog/recoveryenabled no)、
  命令行历史(4688 被清后的第二只眼)、Prefetch 执行痕(vssadmin/
  wbadmin/bcdedit 跑过)。反取证面:1102 清日志、执行痕迹异常
  稀少、工具目录被删但痕迹还在。
  【交叉印证】删影命中 → 向后找「短时间大量文件改动」(批量加密
  手感:改动数逐小时陡增、大批文件改成同一陌生后缀、MFT 里窗内
  「落地又被删」)→ 再找勒索信文件名特征锚定加密窗口。三段对
  齐是硬链;只有删影没有加密面,按「疑似前置准备」报,不拔高。
  【注意】正常备份维护窗口(夜间备份作业)也会触发删影类命令,
  结合属主账户与计划任务核对;数据未覆盖的通道(如命令行历史
  未采集)如实宣告「无法排除」。
