# 启发式知识库内置条目(0.21.0-operator-port):尺寸离群算子命中研判
# (web-outlier,对齐索图 size_outlier「同键找叛徒」狩猎思路)。
id: web-size-outlier-triage
title: 尺寸离群(同键找叛徒)命中:怎么解读、往哪挖
applies_to: [web, outlier]
content: >-
  【命中意味着什么】同复合键(path+method+status)的响应尺寸主体聚在
  中位数附近,离群行是偏离超阈的少数派——攻击成功/失败页、数据泄露、
  webshell 回显与正常模板的尺寸差异都会被这个网捞到。锚点行直指那次
  异常响应本身(不是组代表行),查看器可直达。中位数基准+同状态码同
  方法同组+组内样本闸,是为了把动态页的天然抖动挡在外面;即便如此,
  尺寸离群≠实锤,是弱信号。
  【怎么解读】先看方向:偏大的少数派多问「多出来的字节是什么」
  (拖数据/报错堆栈/马回显),偏小的多问「为什么这次没给全」(鉴权
  拦截/空壳响应/探测打点)。detail 里 median_bytes/ratio/direction
  是原始量,直接读不加工。
  【下一步往哪挖】①把离群行的完整请求响应调出来逐字节看——尺寸
  只是引子,内容才是证据;②按 src_ip 聚合该键前后请求,看离群是
  孤立一次(偶发)还是同一来源反复(规律=可利用面);③偏大离群
  优先比对同 path 正常响应模板,差出来的部分常常直接回答「拿了
  什么」;④先排除业务正当性:大文件下载/上传接口、导出功能、
  错误页簇——确认 path 语义一句话能毙掉大半误报;⑤疑似马回显的,
  转主机侧查该 path 文件的落地时间与写者。
