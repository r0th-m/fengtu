# 启发式知识库内置条目:Windows 数据外泄研判(0.22.0-treecourt-port)。
# 写法纪律:回答「怎么解读、往哪挖」,零具体案件值(防过拟合)。
id: win-exfil-staging-and-channel
title: Windows 数据外泄:按「收集 → 打包 → 传输」三段找互证
applies_to: [exfil, windows, host-triage]
content: >-
  【思路】外泄不是单点事件而是一条三段链:先收集(读业务数据)、再打包
  (压缩/加密压缩)、后传输(上传工具/传输协议/网盘通道)。任何一段的
  单条命中都只是弱信号——压缩工具日常办公高频、传输协议内网运维常见、
  网盘域名企业自用正常;价值永远在两段以上的互证。
  【怎么找】打包段:执行痕迹(Prefetch/UserAssist/Shimcache)找压缩
  工具,运行次数少(临时用一次)的比天天用的可疑;命令行历史找打包
  命令,带口令(-p/-hp)的是防 DLP 的升级信号。传输段:外联连接找
  传输协议端口(FTP/TFTP/rsync/FTPS)与网盘/文件传输域名,SRUM 上传量
  Top 找与身份不符的大户。收集段:用时间窗反查文件清单——窗内新建的
  大压缩包、落地后又删掉的(传完即焚)、临时目录里成批汇集的文档。
  【交叉印证】压缩工具执行痕 × 上传外联 × 时间窗内压缩包落地,三者
  对齐才升级;只有一边的如实标注「证据单薄,待人工核」。
  【注意】先排除合法解释:运维备份脚本、企业同步盘、开发打包发布。
  活动时段是重要旁证——深夜/节假日/离职前后的集中打包外联是典型
  钟点,但时段正常不能反推清白。
