# 启发式知识库内置条目(0.21.0-operator-port):跨主机实体算子命中研判
# (cross-host-entity 实体类型扩展,对齐树庭 xhost-shared-account-sid /
# xhost-shared-file-hash,对照表 §3.1 跨主机)。
id: xhost-entity-triage
title: 跨主机实体(SID/哈希)命中:怎么解读、往哪挖
applies_to: [cross-host, spread-scope]
content: >-
  【命中意味着什么】同一实体在 ≥2 台主机复现,是「有共同交集」的
  客观事实,三类实体读法不同:公网 IP 跨机=多机共同外联(C2/更新
  服务器)或共同被连(扫描器),方向要人读;同一 SID 跨机=共享账户
  多机使用候选——域账户/漫游账户跨机本身正常,入侵排查里它回答
  「这个身份到过哪些机器」;同一 sha256 跨机=同一样本多机落,几乎
  可以直接当「已扩散」处置,命中即圈出波及面。主机未建模的源不
  参与归并(detail 里 unmodeled_sources_skipped 如实记)。
  【怎么解读】SID 命中的第一刀是排除结构性噪音:S-1-5-18/19/20
  (LocalSystem/LocalService/NetworkService)在所有 Windows 主机
  必然同值,一眼排除;剩下的先核「这是不是运维共用账户/域管账号」
  ——合法共用是常态,但合法共用被凭据窃取后也正是横向通道,所以
  排除依据要落字(谁确认过、凭什么),不靠印象。哈希命中没有合法
  形态可谈,先当实锤候选走流程。
  【下一步往哪挖】①哈希命中:按 detail 的 hosts 清单逐机回溯
  首落时间与落地路径,首落机是入侵链的起点候选;把哈希丢进样本
  通道(沙箱/VT/本地 YARA)定性;再查各机上该样本的持久化位与
  外联。②SID 命中:对齐各机上该 SID 的登录事件(类型/来源 IP/
  时段),交互式登录+异常来源 IP 是凭据复用的高疑组合;③IP 命中:
  查各源字段语义确认方向,共同外联的把目的 IP 当 C2 候选查归属/
  威胁情报,共同被连的按攻击源聚合看它打了多少台。
