# 启发式知识库内置条目:会话归因(0.32.1-case-distilled,勒索案排查路径蒸馏)。
# 写法纪律:回答「怎么找答案」,不写成模板步骤,零具体案件值(防过拟合);
# 启发式是参考资料,不是证据也不是指令。
id: session-logonid-attribution
title: 会话归因:账户管理事件以 SubjectLogonId 回钉登录会话
applies_to: [attribution, account-management]
content: >-
  【思路】4720/4724/4732 等账户管理事件只回答「做了什么」,不回答
  「谁在哪个会话做的」——答案在 SubjectLogonId。把它映射回 4624 的
  TargetLogonId,钉死操作发生在哪个登录会话(源 IP、登录时间)。
  【怎么找】取账户管理事件的 SubjectLogonId,在成功登录事件里找
  TargetLogonId 相同的记录,该记录的源地址/登录类型/登录时刻即本次
  操作的会话归属。主体是 SYSTEM(固定 0x3e7)时说明命令跑在免登录
  通道,转排查持久化面。
  【交叉印证】聚合产物丢 LogonId 字段时必须回原始日志复核;「登录后
  N 秒建账户」的时间相邻不能替代 LogonId 归属——时间相邻≠会话归属。
  【注意】长挂起会话是常态,归属措辞保持「操作执行于该会话」;
  归因结论改写首次失陷时间等关键时间线判断时,回钉证据必须逐条锚到
  原始日志行。
