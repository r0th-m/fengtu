# 启发式知识库内置条目:持久化排查的常规落脚面(0.19.0-heuristic-kb)。
# 写法纪律:回答「怎么找答案」,零具体案件值(防过拟合)。
id: persistence-surface-crosscheck
title: 持久化排查的常规落脚面:Run 键/计划任务/服务/启动文件夹交叉看
applies_to: [persistence]
content: >-
  【思路】持久化几乎没有「只用一个面」的排查结论:攻击者会选最不起眼
  的面,防守方漏一个面就可能漏掉复活通道。常规落脚面:注册表 Run/
  RunOnce 键、计划任务、服务(含驱动)、启动文件夹;非常见面(WMI
  订阅、COM 劫持、镜像劫持 IFEO、Winlogon/LSA 钩子)在常规面无获
  且案情支持有持久化时再往下追。
  【怎么找】逐面拉出全量清单,先按「新增/非常见」过滤:对照装机基线
  或同批主机——同环境其他机器没有的项才值得逐条看。每个候选项回答
  三个问题:指向的二进制在哪(可写位置落地最可疑)、谁在什么时候建
  的(与入侵时间窗对不对得上)、触发条件是什么(登录/开机/定时)。
  【交叉印证】同一持久化动作常在多个面留痕:计划任务的创建时间、
  服务的安装事件、二进制的落地时间应能互相咬合;咬合不上的候选
  降级处理,如实报「单面迹象,缺交叉印证」。
  【注意】系统自带项与软件自更新项是主要噪音,统计依据必须声明
  排除项;判断权归人,候选一律进待审区。
