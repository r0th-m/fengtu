# 启发式知识库内置条目:挖矿研判(跨平台,0.22.0-treecourt-port)。
id: miner-multi-view-crosscheck
title: 挖矿判定走多视角互证:名单+协议+端口+位置+持久化,单条只算弱信号
applies_to: [miner, windows, linux, host-triage]
content: >-
  【思路】挖矿木马的判定没有单一银弹:知名矿工名有同名正常软件
  的理论可能、矿池端口有合法用途(如 5555 是安卓 adb)、可写目录
  落地有部署脚本撞线。正确姿势是多视角互证——进程名单、stratum
  协议地址、矿池端口连接、可写目录位置、持久化复活,视角对得
  越多定性越硬;单条命中只算弱信号。
  【怎么找】进程面:知名矿工名(xmrig/minerd/cpuminer 类)+
  长期高占用(Windows 看 SRUM CPU Top;Linux 无 SRUM,ps 只有
  瞬时值,靠「常驻+非常见+对得上外联」推断,局限先说死)。
  网络面:stratum 常用端口(3333/4444/5555/7777/8333/14444)
  外联、命令行里 stratum+tcp:// 地址(基本没得洗)。位置面:
  Temp/AppData//tmp//dev/shm 落地的可执行文件、exe 被删还在跑。
  持久化面:计划任务+Run 键+服务(或 systemd+cron+profile.d)
  三处对同一目标 = 复活机制,最高优先级发现。
  【交叉印证】高 CPU 进程 × 矿池端口连接 × 可写目录落地 ×
  多处持久化,链对齐后给「疑似挖矿」;只有端口连接的,如实
  标注证据单薄。
  【注意】命令行证据只有进程快照时(LinuxSC 无 shell 历史),
  已退出的矿工查不到——看不到就如实说,别编;矿机常自删原始
  投放器,MFT/已删除记录里找「落地又被删」的。
