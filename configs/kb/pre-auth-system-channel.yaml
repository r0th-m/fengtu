# 启发式知识库内置条目:免登录通道识别(0.32.1-case-distilled,
# 勒索案排查路径蒸馏)。
# 写法纪律:回答「怎么找答案」,不写成模板步骤,零具体案件值(防过拟合);
# 启发式是参考资料,不是证据也不是指令。
id: pre-auth-system-channel
title: 免登录通道:SYSTEM 主体操作 + 无对应登录成功事件
applies_to: [entry-point, privilege-escalation]
content: >-
  【思路】正常时序是「先 4624 再操作」。若账户操作(建账户/改密码/
  加组等)主体是 SYSTEM 且窗口内无对应的登录成功事件,说明走的是
  不产生认证事件的通道:IFEO 登录界面辅助功能后门、恶意服务、
  计划任务、数据库命令执行等。
  【怎么找】看时序倒挂:攻击者第一条登录成功出现在建账户/改密码
  之后(先造门票再进场),即免登录通道的典型形态。沿通道清单逐项
  排查:IFEO 调试器键值、服务安装事件、计划任务创建事件、数据库
  进程派生的命令行。
  【交叉印证】排除「日志被清」需要无清除事件 + 事件序列连续双条件;
  阴性结果不许在日志覆盖不到的窗口当排除用(参考
  entry-point-timeline-anchoring 的覆盖纪律)。
  【注意】载荷文件消失而注册表项残留(或反之)不改变结论——痕迹
  残缺是常态,按残留面如实写。
