# 启发式知识库内置条目:驻留位置与签名面研判(0.22.0-treecourt-port)。
id: persistence-writable-dir-signal
title: 驻留面:位置异常与签名异常是两个弱信号,咬合才升档
applies_to: [persistence, windows, host-triage]
content: >-
  【思路】驻留项(计划任务/Run 键/服务)看两个维度:位置(执行体
  落在哪)与签名(二进制过没过校验)。每个维度单独都是弱信号——
  合法软件也装用户目录、开源工具也常无签名;「驻留位 × 非系统
  位置」「驻留位 × 未过签」两个弱信号咬合成强信号,这是驻留面
  研判的基本功。任务名可以伪装,执行体路径骗不了人。
  【怎么找】三处持久化位对着看:计划任务的执行体路径、Run 键
  取值、服务 ImagePath——指向 AppData/Temp/ProgramData/Public/
  Users 的都拎出来。签名校验面:驻留项引用的二进制签名状态非
  Valid(未签名/哈希失配/不受信)的,与路径维度交叉。同一目标
  (同一路径/同一名称变体)出现在两处以上持久化位 = 复活机制,
  删一处从另一处长回来,这是最高优先级发现。
  【交叉印证】驻留命中与 7045/4698 事件对账:创建时间、创建者
  账户、映像路径对不对得上;日志里有而清单里没有的(可能已被
  清理)单独说。
  【注意】便携软件、企业自研工具会撞线,报之前先说排除理由;
  浏览器扩展通道(强制安装策略/Native Messaging 清单位可写
  目录)冷门但查到的都是干货,先核对是否企业管控基线。
