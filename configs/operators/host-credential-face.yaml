# 凭据面:4648 显式凭据登录 + SAM/SECURITY 配置单元访问(两翼)。
# 4648:localhost/占位目标结构性排除(本机 runas 是常态);SAM 访问:
# 对象模式命中且进程不在系统白名单(lsass/winlogon 等访问 SAM 是常态,
# 白名单是 spec 数据)→ 两点咬合(强疑似)。
id: host-credential-face
title: 凭据面(SAM 访问/4648 显式凭据)
family: host
severity: high
applicable_to:
  log_types: [windows_event_log]
params:
  explicit_events: ["4648"]
  sam_events: ["4656", "4663"]
  sam_object_patterns:
    - '(?i)\\REGISTRY\\MACHINE\\(SAM|SECURITY)'
    - '(?i)HKLM\\(SAM|SECURITY)'
  sam_process_allowlist:
    - '(?i)\\(lsass|winlogon|csrss|smss|services|svchost)\.exe$'
    - '(?i)^(system|registry)$'
implemented: true
note: 先问「谁对谁用了谁的凭据」/「什么进程碰了 SAM」;管理员运维也产 4648
max_hits: 500
