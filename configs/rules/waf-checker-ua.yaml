# 索图规则资产迁移(2026-09-25 对照表 §2.2,语义不变,签名内容未缩水;
# target 索图原作 web,丰图 log_type 分类未落地,按引擎 spec 写 any——
# 引擎只支持 any,写 web 会拒载,不猜;scanner-ua 已同法迁移)
# 云防线/安全检查器 User-Agent 指纹
id: waf-checker-ua
title: 云防线/安全服务检查器 UA(归因提示)
severity: info
target: any
match:
  ua:
    - "QIANXIN CHECKER"
note: >-
  安全服务巡检/云防线回源的 UA 自我标识。命中本身不是攻击,是一条
  **归因提示**:站点挂在云防线之后时,日志首列 src_ip 是回源节点,
  真实客户端在 XFF(解析器已抽为 xff 字段,可字段检索)——20260807
  案初期曾把回源节点误判为攻击者,立此规则防重蹈。命中建议复核同
  IP 的其他请求是否都带各异 XFF 来佐证。token 只收真实日志里观察到
  的(目前仅奇安信 QIANXIN CHECKER,08-04/08-09 两次独立观察到),
  不凭印象扩词;新观察到的检查器 UA 按证据追加。
