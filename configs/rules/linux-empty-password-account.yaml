# Linux:空密码账户(passwd 密码字段为空 = 无需密码即可登录)
# 丰图适配:引擎表达不了「等于空串」(子串须非空),解析器对空密码字段
# 派生 empty_password=true(树庭 password_field:"" 语义的承载,如实注释)。
# severity:树庭 critical,丰图词表最高 high(如实降档,语义不变)。
id: linux-empty-password-account
title: 空密码账户(passwd 密码字段为空)
severity: high
target: any
match:
  source_eq: [passwd]
  empty_password_eq: ["true"]
note: >-
  /etc/passwd 密码字段为空串的账户:空密码意味着该账户无需密码即可登录
  (第二字段 x 表示走 shadow,!/* 表示锁定;空串才是真空)。
  任何系统上都不该出现,命中即最高优先待审。
