# 勒索排查·意图链模板(切片六;由树庭 windows-ransomware-v1 手册蒸馏为意图树——
# 数据不是代码,零具体案件值;排查要点是方法论,案件上下文由 worker 工具返回)
#
# 树形:加密定位与日志完整性双根并查 → 进入路径 → 横向 → 通道/凭据 →
# 执行链 → 崩溃关联(0.32.1)→ 持久化 → 反取证 → 窃取面 →
# 邻机波及(scope=all,过审批门)→ 独立复核(0.32.1)→ 覆盖闸收官。
# 深度 ≤5(引擎上限 5)。
# 主机域(切片七,§3 修正稿一案多包):单主机意图 host_scope=each(每台
# 已建模主机各派一条,worker 工具限定该机源集合);横向/波及/复核/收官
# host_scope=all(显式全案件跨机)。
id: ransomware-triage
version: 1
title: 勒索排查(意图链模板)
description: >-
  「已经出事了」路径:加密事件定位 → 日志完整性 → 登录面 → 横向移动 →
  执行链 → 崩溃关联 → 远控通道 → 凭据暴露面 → 反取证 → 持久化 → 窃取面 →
  邻机波及 → 独立复核 → 覆盖闸。数据缺失如实报「数据未覆盖」,不硬编。
os: windows
goal: >-
  勒索事件完整还原:加密窗口与规模、进入路径、横向移动、执行链、通道、
  凭据、反取证、波及面——每条意图查完如实评估,覆盖不全如实标。
intents:
  - key: enc_locate
    host_scope: each
    text: 有没有「同一陌生后缀短时间大批量新增」的文件群或勒索信痕迹(加密事件定位)?
    ask: >-
      先定案发现场:检索文件/事件类源里的勒索信特征文件名与陌生后缀聚类。
      有就给出:后缀名、首末出现时间(=加密窗口)、规模、目录分布;同一后缀
      多套个人 ID 分开列(可能不止一次加密)。没有就如实说,别拿正常批量
      文件(编译输出、缓存)凑数。
  - key: log_integrity
    host_scope: each
    text: 各日志通道账本完整吗(有没有被清/被卷没/中途断档)?
    ask: >-
      完整性先于内容:按源看按日事件量分布——有没有全天归零(选择性清痕
      是攻击日铁证)、只剩最近一小段(噪声卷没)、中途断档;再找清日志事件
      (如 1102)。窗口缺失的通道如实宣告不可用,后续意图不许假装查过。
  - key: logon_surface
    after: [log_integrity]
    text: 加密前的登录面有没有非常态来源(RDP/SMB 一次成功无试错、先错后对、同秒多并发)?
    ask: >-
      查进来的人:认证类事件按登录类型×来源×账户聚合——type10(RDP)与
      type3(SMB)的非常态来源是重点:一次成功无试错(凭据现成)、先错后对
      (爆破得手)、同秒多并发(自动化)。每个可疑来源给「首次出现时刻+
      行为+是否得手」。可跑 host-auth-chain 算子再人工核实锚点。
  - key: lateral
    after: [logon_surface]
    host_scope: all
    text: 有没有横向移动迹象(显式凭据登录、本机作为客户端的外连里业务上说不通的目标)?
    ask: >-
      还原扩散:显式凭据登录事件——用了哪些账户、打了哪些目标、各几次;
      本机外连里哪些目标业务上说不通。把「凭据 → 目标」画成清单。
      数据未覆盖(事件 ID 在白名单外)如实报缺。
  - key: remote_channel
    after: [lateral]
    text: 有没有审计逃逸型远控通道(消费级远控软件,不产生常规登录事件)?
    ask: >-
      找通道:重点想消费级远控(ToDesk/向日葵/RustDesk/AnyDesk 类)——
      不产生 type10、流量走厂商中继。安装目录/服务/进程/执行痕迹里有没有
      这类软件?查不到就如实说,别硬安一个。
  - key: credential_exposure
    after: [lateral]
    text: 本机存了哪些「攻击者拿下即可白拿」的凭据(凭据暴露面)?
    ask: >-
      翻钥匙串:保存的凭据/凭据类事件反查——本机存了哪些目标的凭据?
      存了≠已用,滥用要登录证据;查不到凭据事件如实报未覆盖。
  - key: exec_chain
    after: [enc_locate]
    text: 执行痕迹里有没有攻击工具链(密码抓取/扫描/进程对抗/仿冒名/异常位置)?
    ask: >-
      找凶器:执行痕迹(UserAssist/Shimcache/Prefetch 等)里哪些程序可疑?
      盯:密码抓取类、扫描类、进程对抗类、仿冒系统名(形近字)、异常位置
      (Temp/Public/用户目录)。已被删除的也能从痕迹还原——照实说「已删除」。
  # 0.32.1-case-distilled:崩溃事件×加密后缀名/可疑进程名关联(蒸馏自
  # 成功勒索案:Application 崩溃记录是定位加密器的核心一跳)
  - key: crash_correlate
    after: [exec_chain]
    text: Application 崩溃事件(1000/1001/1026)与加密后缀名/可疑进程名有没有关联?
    ask: >-
      崩溃事件是独立的执行证据通道:检索 Application 日志 1000/1001/1026
      (应用程序错误/Windows 错误报告/.NET Runtime),把崩溃进程名与已
      确认的加密后缀名、前序盯上的可疑进程名对撞——恶意代码不稳定,
      崩溃往往比稳定运行留痕更多。命中名字关联后,用进程名反查文件清单/
      WER 报告目录补第二跳。崩溃点前后若有运行时安装/卸载(MSI 类)
      事件,按「攻击者在修环境」读法锚进时间线;崩溃转储(hdmp)存在时
      提示样本可从中找回。查不到崩溃事件如实说,不硬凑。
  - key: persistence
    after: [exec_chain]
    text: 有没有持久化布置(名实不符的计划任务/服务/启动项/驱动)?
    ask: >-
      查留下:计划任务名实不符、可疑服务与启动项、非常态驱动。可跑
      host-persistence-task 算子再核实;系统正常项别凑数。
  - key: anti_forensics
    after: [log_integrity]
    text: 有没有反取证动作(清日志/清痕迹/删卷影/异常关机)?
    ask: >-
      数被擦掉的痕迹:清日志事件、执行痕迹异常稀少(被清空)、卷影删除、
      工具目录被删但执行痕迹还在、异常关机重启。每一项给「正常解释不成立」
      的理由;没有反取证动作也是结论。
  - key: exfil_surface
    after: [remote_channel]
    text: 有没有数据窃取迹象(大体积外发/压缩打包痕迹/可疑上载)?
    ask: >-
      看窃取面:外发字节量异常、加密前短时间大批量压缩打包、可疑上载通道。
      统计迹象必须声明排除项(正常备份/同步也会产生同样迹象)。
  - key: neighbor_impact
    after: [lateral]
    scope: all
    host_scope: all
    text: 横向目标清单上的邻机有没有波及迹象(跨案件/全源批量核查)?
    ask: >-
      批量执行意图(范围=全案件/全源,需人批准):拿横向移动还原出的
      「凭据 → 目标」清单,逐目标核查波及迹象。这是跨源批量核查,
      资源消耗大,先报计划再动手。
  # 0.32.1-case-distilled:独立复核固定节点(收官前;蒸馏自成功勒索案
  # 排查——该案全部重大错误都是第二遍核验抓出来的)
  - key: independent_review
    after: [persistence, crash_correlate, anti_forensics]
    host_scope: all
    text: 独立复核:换一个视角复核本链关键归因,初稿结论经得起第二遍核验吗?
    ask: >-
      收官前固定节点(初稿 → 独立复核 → 更正):换一个视角复核本链
      关键归因——①会话回钉:把账户操作归因到登录会话时,会话标识
      (Windows 的 LogonId 一类)是否回钉到登录成功事件核实过,还是
      靠时间相邻猜的(时间相邻≠会话归属);②阴性结果的日志覆盖前提:
      宣告「没有 X」之前先确认该通道在该窗口有覆盖,覆盖不到的窗口
      如实标「不可考」,不拿阴性结果当排除;③关键时间点(首次失陷/
      操作窗口)换一条证据路径重新推一遍,与初稿不一致就如实更正,
      不护短。
  - key: coverage_gate
    after: [persistence, anti_forensics, neighbor_impact, independent_review]
    host_scope: all
    text: 覆盖闸收官:哪些品类查过、哪些没查过,还有没有未核实的疑点?
    ask: >-
      收官宣告:对照源覆盖逐项宣告「查过/未覆盖/数据缺失」,零沉默;
      未核实疑点列成清单交给人。覆盖不全如实标,不硬编结论。
