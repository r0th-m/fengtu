# 横向移动排查·意图链模板(0.22.0-treecourt-port;由树庭 lateral-movement-v1
# 手册蒸馏为意图树——通用行为链:远程登录 → 管理端口互连 → 远程落脚 →
# 共享访问 → 账户 → 横向工具 → 远控会话 → 时间线串链)
id: lateral-movement
version: 1
title: 横向移动排查(意图链模板)
description: >-
  横向移动排查:安全日志远程登录(4624/4625 类型 3/10,含反证观察点)、
  远程管理端口互连(445/3389/5985)、4698/7045 远程创建落点、admin$
  共享访问(5140/5145 无明细只有计数,如实标注)、共享/同名账户盘点、
  psexec 类横向工具执行痕迹、远控工具会话、时间线串链。
  数据缺失如实报「数据未覆盖」,不硬编。
os: windows
goal: >-
  还原横向移动路径:每一跳的来源与目标、凭据从哪来到哪去、落点在哪;
  缺证据的跳如实标注待补采,判断权归人。
intents:
  - key: remote_logons
    host_scope: each
    text: 远程登录(4624/4625 类型 3/10)里有没有非常态来源与爆破得手模式?
    ask: >-
      横向进门先看登录账:4624/4625 里挑网络登录(类型 3)和远程交互
      (类型 10,RDP),盯:来源 IP 是内网其他主机(谁在连我)、登录账户与
      该机身份不符、爆破特征(密集 4625 后接一条 4624)、陌生账户首次出现。
      本机正常交互登录(类型 2/11)不用报。给出假设时同时给反证观察点:
      若「攻击者已持有该账户有效凭据」成立,则不应观察到针对该账户的持续
      密集 4625 失败——密集失败反而证伪「凭据已到手」;去数据里找这些反证,
      找到了就显式说出哪个假设被排除。
  - key: admin_connections
    host_scope: each
    text: 远程管理端口(445/3389/5985)上谁在连谁?
    ask: >-
      看谁在连谁:本机 445/3389 上的已建立连接(有内网机器连进来,对端
      是谁)、本机主动连别机管理端口(我是跳板)、多台主机间的链式互连。
      正常文件共享/域控流量会有,结合登录账判断,别见 445 就报。
  - key: remote_task_service
    after: [remote_logons]
    host_scope: each
    text: 4698 计划任务/7045 新服务里有没有远程落点?
    ask: >-
      横向进来要落脚:4698 计划任务创建、7045 新服务是远程落脚的两大
      经典——看创建者账户(是不是远程登录进来的那个)、映像路径(可写
      目录/远程共享路径 \\host\share 的直接高危)、创建时间和登录时间
      咬不咬合。现有计划任务清单和 4698 对不上的(建了又删的)单独说。
  - key: admin_shares
    after: [remote_logons]
    host_scope: each
    text: admin$ 共享访问有没有活动(5140/5145 只有计数时的诚实口径)?
    ask: >-
      丑话说前头:5140/5145(共享访问)若只有通道聚合计数没有逐条明细,
      就如实说「有计数无明细,建议补采」,不许编记录。在已入库的 4624
      类型 3 里找访问来源,结合前序推断 admin$/IPC$ 被谁用过。
  - key: shared_accounts
    after: [remote_logons]
    host_scope: each
    text: 本机账户里哪些也出现在远程登录事件里(共享/同名账户面)?
    ask: >-
      盘户口看共享面:本机账户里哪些出现在前序远程登录事件里(谁在用
      谁)、带 SID 的域账户/漫游账户(跨机共用身份)、意外启用的 Guest/
      默认账户、尾随 $ 的隐藏账户。内建账户如实说明,别凑数。
  - key: lateral_tools
    host_scope: each
    text: 执行痕迹和进程快照里有没有横向工具指纹(psexec/wmic/winrs/侦察命令)?
    ask: >-
      找横向工具的指纹:psexec/psexesvc、wmic 远程调用、winrs/winrm、
      at/schtasks 远程创建、net use/net view、qwinsta/query 侦察命令、
      powershell 远程会话痕迹。管理员日常运维也用这些,结合时间线和
      来源判断,别把运维当攻击。
  - key: remote_access
    host_scope: each
    text: 有没有远控工具会话(AnyDesk/向日葵类;谁连进来、对端是谁)?
    ask: >-
      远控工具也是横向的一条腿:AnyDesk/向日葵等的会话记录(incoming/
      outgoing、对端 ID、时间)。盯:incoming 会话(谁连进来的)、会话
      时间与登录/落点事件咬合的、对端 ID 反复出现的。企业统一部署的
      远控合法,结合环境说理由;查不到安装痕迹就如实说。
  - key: timeline
    after: [remote_task_service, admin_shares, shared_accounts, lateral_tools, remote_access, admin_connections]
    host_scope: all
    text: 横向移动时间线串链:「远程登录 → 共享/工具 → 落点 → 继续外跳」?
    ask: >-
      并账:按前序时间提示拉时间窗内事件,串一条「远程登录 → 共享/工具 →
      落点(任务/服务)→ 继续外跳」的横向链,标出每一跳的来源和目标。
      哪一跳缺证据就如实标注待补采,别硬连。
  # 0.32.1-case-distilled:独立复核固定节点(收官前;蒸馏自成功勒索案
  # 排查——该案全部重大错误都是第二遍核验抓出来的)
  - key: independent_review
    after: [timeline]
    host_scope: all
    text: 独立复核:换一个视角复核本链关键归因,初稿结论经得起第二遍核验吗?
    ask: >-
      收官前固定节点(初稿 → 独立复核 → 更正):换一个视角复核本链
      关键归因——①会话回钉:把操作归因到登录会话时,会话标识
      (Windows 的 LogonId 一类)是否回钉到登录成功事件核实过,还是
      靠时间相邻猜的(时间相邻≠会话归属);②阴性结果的日志覆盖前提:
      宣告「没有 X」之前先确认该通道在该窗口有覆盖,覆盖不到的窗口
      如实标「不可考」,不拿阴性结果当排除;③关键时间点(首次失陷/
      操作窗口)换一条证据路径重新推一遍,与初稿不一致就如实更正,
      不护短。
  - key: coverage_gate
    after: [timeline, independent_review]
    host_scope: all
    text: 覆盖闸收官:哪些品类查过、哪些没查过,还有没有未核实的疑点?
    ask: >-
      收官宣告:对照源覆盖逐项宣告「查过/未覆盖/数据缺失」,零沉默;
      未核实疑点列成清单交给人。覆盖不全如实标,不硬编结论。
