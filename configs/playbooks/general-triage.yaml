# 通用排查·意图链模板(切片六;由树庭 general-triage-v1 手册蒸馏为意图树——
# 数据不是代码,零具体案件值;「有没有事」基线路径)
#
# 树形:画像与日志窗口可用性审计前置(完整性先于内容)→ 进程/执行痕迹/
# 登录面并查 → 账户/持久化/凭据/远控 → 时间线发酵 → 覆盖闸收官。
# 主机域(切片七):单主机意图 host_scope=each;覆盖闸 host_scope=all。
id: general-triage
version: 1
title: 通用排查(意图链模板)
description: >-
  「有没有事」基线:主机画像与日志窗口审计 → 外联 → 进程 → 执行痕迹 →
  登录面 → 账户 → 持久化 → 凭据暴露面 → 远控痕迹 → 时间线发酵 → 覆盖闸。
  数据缺失如实报「数据未覆盖」,不硬编。
os: windows
goal: >-
  回答「这台机器有没有事」:登录面、进程、持久化、凭据、通道逐项排查,
  窗口缺失的品类如实宣告,结论只到「疑似候选」,判断权归人。
intents:
  - key: profile_integrity
    host_scope: each
    text: 主机画像与日志窗口可用性审计——机器是谁?手里这些日志还「在不在」?
    ask: >-
      开工先答两个问题:一,这台机器的角色/时区/安装日期(安装日期贴着
      案件时间 → 可能重装灭痕,单独拎出来);二,各通道事件量分布有没有
      哪天归零(被清)、只剩最近一小段(被卷没)、中间断档。窗口不在的
      通道直接宣告不可用,后续意图不许假装查过。
  - key: outbound
    host_scope: each
    text: 外联网络连接里有没有不对劲的地址/端口/进程组合?
    ask: >-
      看门外的脚印:公网 IP 直连非常见端口、莫名进程持有外联、符合远控/C2
      端口特征的。每条给怀疑理由;NTP/DNS/系统更新这类正常外联别凑数。
  - key: processes
    after: [profile_integrity]
    text: 进程快照里有没有可疑进程(可写位置落地/仿冒系统名/随机名)?
    ask: >-
      看屋里的人:Temp/AppData/用户目录落地、仿冒系统名(svch0st 类形近)、
      随机名、与规则命中对得上的。系统常见进程别报,报了你得说得出哪里不对。
  - key: exec_traces
    after: [profile_integrity]
    text: 注册表执行痕迹(UserAssist/Shimcache/MuiCache)里哪些程序跑过本身可疑?
    ask: >-
      翻注册表旧账:只在临时目录出现过的、撞名系统工具但路径不对的、运行
      次数极少的、时间与其他可疑点咬合的。办公/系统软件正常痕迹不用报。
  - key: eventlog
    after: [profile_integrity]
    text: 事件日志登录面有没有异常(爆破/非常态来源/特权滥用/账户增删/清日志)?
    ask: >-
      查事件日志:登录事件按类型×来源×账户聚合——重点找 type10/type3 非常态
      来源、短时间高频失败、失败后紧跟成功;再看特权分配、计划任务增改、
      账户增删、清日志。可跑 host-auth-chain 算子再核实锚点。
  - key: accounts
    after: [eventlog]
    text: 账户有没有不对劲(意料外的本地账户/仿冒名/隐藏账户/默认账户启用)?
    ask: >-
      盘户口:意料之外的本地账户(尤其带管理员权限)、仿冒名、尾随 $ 的
      隐藏账户、Guest/默认账户被启用、密码设置时间异常集中。内建账户
      如实说明即可。
  - key: persistence
    after: [processes]
    text: 有没有持久化布置(计划任务/启动项/服务/驱动)?
    ask: >-
      查留下:计划任务名实不符、可疑服务与启动项、非常态驱动。可跑
      host-persistence-task 算子再核实;系统正常项别凑数。
  - key: credential_exposure
    after: [eventlog]
    text: 本机存了哪些「攻击者拿下即可白拿」的凭据(凭据暴露面)?
    ask: >-
      翻钥匙串:保存的凭据/凭据类事件反查——存了哪些目标的凭据?存了≠
      已用,滥用要登录证据;查不到凭据事件如实报未覆盖。
  - key: remote_tools
    after: [outbound]
    text: 有没有消费级远控软件痕迹(审计逃逸型通道)?
    ask: >-
      找通道:消费级远控(ToDesk/向日葵/RustDesk/AnyDesk 类)的安装目录/
      服务/进程/执行痕迹;有正在用的列出日志目录路径,建议人工提取会话
      日志。查不到安装痕迹就如实说,别硬安一个。
  - key: timeline_ferment
    after: [accounts, persistence, credential_exposure]
    text: 时间线发酵:前序疑点排在同一时间轴上,能不能互相印证或证伪?
    ask: >-
      排轴→分级→复核:把前序疑点按时间排轴,看咬合关系(先错后对的登录
      → 紧跟着的工具执行 → 随后的持久化布置,这类链);对不上的降级,
      印证的补强,新长出的疑点如实列出。
  # 0.32.1-case-distilled:独立复核固定节点(收官前;蒸馏自成功勒索案
  # 排查——该案全部重大错误都是第二遍核验抓出来的)
  - key: independent_review
    after: [accounts, persistence, credential_exposure]
    host_scope: all
    text: 独立复核:换一个视角复核本链关键归因,初稿结论经得起第二遍核验吗?
    ask: >-
      收官前固定节点(初稿 → 独立复核 → 更正):换一个视角复核本链
      关键归因——①会话回钉:把操作归因到登录会话时,会话标识
      (Windows 的 LogonId 一类)是否回钉到登录成功事件核实过,还是
      靠时间相邻猜的(时间相邻≠会话归属);②阴性结果的日志覆盖前提:
      宣告「没有 X」之前先确认该通道在该窗口有覆盖,覆盖不到的窗口
      如实标「不可考」,不拿阴性结果当排除;③关键时间点(首次失陷/
      操作窗口)换一条证据路径重新推一遍,与初稿不一致就如实更正,
      不护短。
  - key: coverage_gate
    after: [timeline_ferment, remote_tools, exec_traces, independent_review]
    host_scope: all
    text: 覆盖闸收官:哪些品类查过、哪些没查过,还有没有未核实的疑点?
    ask: >-
      收官宣告:对照源覆盖逐项宣告「查过/未覆盖/数据缺失」,零沉默;
      未核实疑点列成清单交给人。覆盖不全如实标,不硬编结论。
